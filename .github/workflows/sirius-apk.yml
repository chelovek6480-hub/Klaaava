name: Sirius APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant
        required: false
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Gradle version is taken from the repository's own wrapper
      # descriptor and then installed by the action, instead of running
      # ./gradlew. A wrapper jar is a binary in the repo: it may be
      # missing, stripped by a .gitignore, or hand-built for an
      # on-device IDE, and any of those turns into a five-minute CI
      # failure that reads like a compile error.
      - name: Resolve the Gradle version
        id: gradle
        run: |
          VERSION=8.9
          PROPS=gradle/wrapper/gradle-wrapper.properties
          if [ -f "$PROPS" ]; then
            FOUND=$(grep -o 'gradle-[0-9.]*-\(bin\|all\)\.zip' "$PROPS" | head -1 | sed 's/gradle-//; s/-bin\.zip//; s/-all\.zip//')
            if [ -n "$FOUND" ]; then VERSION="$FOUND"; fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle.outputs.version }}

      - name: Build APK
        run: |
          TASK=assembleDebug
          if [ "${{ inputs.variant }}" = "release" ]; then TASK=assembleRelease; fi
          gradle "$TASK" --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.variant }}
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 14
